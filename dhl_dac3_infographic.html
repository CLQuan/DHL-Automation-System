<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHL DAC 3.0 Knowledge Base Infographic</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
.chart-container { position: relative; width: 100%; max-width: 800px; margin: auto; height: 40vh; max-height: 400px; }
body { background-color: #f4f5f7; color: #333333; font-family: sans-serif; }
.dhl-red { color: #D40511; }
.bg-dhl-red { background-color: #D40511; }
.dhl-yellow { color: #FFCC00; }
.bg-dhl-yellow { background-color: #FFCC00; }
</style>
</head>
<body class="antialiased pb-20">
<header class="bg-[#131313] text-white py-12 px-6 shadow-lg border-b-8 border-dhl-red">
<div class="max-w-6xl mx-auto">
<h1 class="text-4xl font-extrabold mb-4 uppercase tracking-wide"><span class="dhl-yellow">DHL DAC 3.0</span> Logistics Hub</h1>
<p class="text-lg text-gray-300">AI-Powered Knowledge Base Automation infographic dashboard.</p>
</div>
</header>
<main class="max-w-6xl mx-auto px-6 mt-12 space-y-16">
<section class="bg-white p-8 rounded-2xl shadow-sm grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
<div>
<h2 class="text-2xl font-bold mb-4">Rubric Evaluation Priorities</h2>
<p class="text-gray-600">Weight distribution highlighting the mandatory focus on Automation logic and Robust Error Handling (4/4 rating requirements).</p>
</div>
<div class="chart-container"><canvas id="rubricChart"></canvas></div>
</section>
</main>
<script>
const ctx = document.getElementById('rubricChart').getContext('2d');
new Chart(ctx, {
type: 'bar',
data: {
labels: [['UI/UX','Design'], ['CRUD','Ops'], ['API','Integration'], ['Process','ID'], ['RPA','Logic'], ['Error','Handling']],
datasets: [{ label: 'Weight (%)', data: [16, 16, 16, 20, 20, 20], backgroundColor: ['#FFCC00','#FFCC00','#FFCC00','#D40511','#D40511','#D40511'] }]
},
options: { maintainAspectRatio: false }
});
</script>
</body>
</html>
