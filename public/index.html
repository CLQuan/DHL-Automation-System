<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL DAC 3.0 Knowledge Base</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dhl-header">
        <div class="logo">DHL DAC 3.0</div>
        <div class="subtitle">Knowledge Base Builder</div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <h3>Filters</h3>
            <div class="filter-group">
                <label>Status</label>
                <select id="statusFilter" title="Filter articles by status"></select>
                    <option value="all">All Statuses</option>
                    <option value="Published">Published</option>
                    <option value="Reviewed">Reviewed</option>
                    <option value="Draft">Draft</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Tags</label>
                <div id="tagFilters" class="tag-cloud">
                </div>
            </div>
            <div class="stats">
                <p>Total Articles: <span id="totalCount">0</span></p>
            </div>
            <div class="rpa-section">
                <h3>RPA Integration</h3>
                <p>Sync logic via UiPath robot</p>
                <a href="/api/rpa/download" class="dhl-btn rpa-download">Download Workflow</a>
                <div class="rpa-status">
                    <span class="status-dot"></span>
                    <span>System Ready</span>
                </div>
            </div>
        </aside>

        <main class="content">
            <div class="controls">
                <h2>Knowledge Hub</h2>
                <div class="view-options">
                    <button id="toggleConnections" class="dhl-btn">Toggle Connections</button>
                </div>
            </div>
            
            <div id="articlesGrid" class="articles-grid">
            </div>
        </main>
    </div>

    <svg id="connectionsLayer" class="connections-layer"></svg>

    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/presenter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
